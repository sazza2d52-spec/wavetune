name: Build WaveTune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wavetune.zip file
        run: |
          if [ -f "wavetune.zip" ]; then
            echo "wavetune.zip found! Extracting..."
            unzip -q wavetune.zip -d extracted_project
          else
            echo "Error: wavetune.zip not found in root directory!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Project Structure and Build APK
        run: |
          # যদি app ফোল্ডারটি সরাসরি extracted_project এর ভেতর থাকে
          if [ -d "./extracted_project/app" ]; then
            MAIN_DIR="./extracted_project"
          else
            # অন্যথায় যেখানে app ফোল্ডার আছে তার প্যারেন্ট ডিরেক্টরি খুঁজে বের করা
            APP_PATH=$(find ./extracted_project -type d -name "app" -print -quit)
            if [ -z "$APP_PATH" ]; then
              echo "Error: 'app' folder not found inside the zip!"
              exit 1
            fi
            MAIN_DIR=$(dirname "$APP_PATH")
          fi
          
          echo "Main Android project root is: $MAIN_DIR"
          cd "$MAIN_DIR"
          
          # মেইন রুট ডিরেক্টরিতে গ্র্যাডল র‍্যাপার তৈরি করা
          echo "Generating gradle wrapper in root directory..."
          gradle wrapper --gradle-version 8.3
          
          # পারমিশন দিয়ে বিল্ড রান করা
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-APK
          path: "**/build/outputs/apk/debug/*.apk"

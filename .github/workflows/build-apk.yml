name: Check Zip Contents

on:
  workflow_dispatch:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List Zip Content
      run: |
        echo "=== Repository Files ==="
        ls -la
        echo "=== Zip Content ==="
        unzip -l wavetune.zip || echo "Not a valid zip file or file missing!"

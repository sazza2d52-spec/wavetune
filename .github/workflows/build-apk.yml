name: Build WaveTune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wavetune.zip file
        run: |
          if [ -f "wavetune.zip" ]; then
            echo "wavetune.zip found! Extracting..."
            unzip -q wavetune.zip -d extracted_project
          else
            echo "Error: wavetune.zip not found in root directory!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper and Build APK
        run: |
          # build.gradle ফাইলটি কোন ফোল্ডারে আছে তা খুঁজে বের করা
          BUILD_GRADLE_PATH=$(find ./extracted_project -name "build.gradle" -print -quit)
          
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            # যদি build.gradle না পাওয়া যায়, তবে build.gradle.kts খোঁজা
            BUILD_GRADLE_PATH=$(find ./extracted_project -name "build.gradle.kts" -print -quit)
          fi
          
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: Android project (build.gradle) not found inside the zip!"
            exit 1
          fi
          
          BUILD_DIR=$(dirname "$BUILD_GRADLE_PATH")
          echo "Found Android project folder in: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          # নতুন গ্র্যাডল র‍্যাপার (gradlew) জেনারেট করা
          echo "Generating missing gradle wrapper..."
          gradle wrapper --gradle-version 8.3
          
          # পারমিশন দিয়ে বিল্ড রান করা
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-APK
          path: "**/build/outputs/apk/debug/*.apk"

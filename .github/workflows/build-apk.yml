name: Build WaveTune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wavetune.zip file
        run: |
          if [ -f "wavetune.zip" ]; then
            echo "wavetune.zip found! Extracting..."
            unzip -q wavetune.zip -d extracted_project
          else
            echo "Error: wavetune.zip not found in root directory!"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Stable Gradle Wrapper and Build APK
        run: |
          if [ -d "./extracted_project/app" ]; then
            MAIN_DIR="./extracted_project"
          else
            APP_PATH=$(find ./extracted_project -type d -name "app" -print -quit)
            if [ -z "$APP_PATH" ]; then
              echo "Error: 'app' folder not found inside the zip!"
              exit 1
            fi
            MAIN_DIR=$(dirname "$APP_PATH")
          fi
          
          echo "Main Android project root is: $MAIN_DIR"
          cd "$MAIN_DIR"
          
          # সবচেয়ে স্থিতিশীল এবং সামঞ্জস্যপূর্ণ গ্র্যাডল ভার্সন ৮.০ জেনারেট করা
          echo "Generating stable gradle wrapper version 8.0..."
          gradle wrapper --gradle-version 8.0
          
          # পারমিশন দিয়ে বিল্ড রান করা
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-APK
          path: "**/build/outputs/apk/debug/*.apk"

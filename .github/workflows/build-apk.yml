name: Build WaveTune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wavetune.zip file
        run: |
          if [ -f "wavetune.zip" ]; then
            echo "wavetune.zip found! Extracting..."
            unzip -q wavetune.zip -d extracted_project
          else
            echo "Error: wavetune.zip not found in root directory!"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Directly
        run: |
          # জিপ ফাইলের ভেতর যেখানেই gradlew স্ক্রিপ্টটি থাকুক না কেন তা খুঁজে বের করা
          GRADLEW_PATH=$(find ./extracted_project -type f -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: 'gradlew' file not found anywhere inside the extracted project!"
            exit 1
          fi
          
          # gradlew ফাইলটি যে ফোল্ডারে আছে সেই ডিরেক্টরি নির্ধারণ করা
          MAIN_DIR=$(dirname "$GRADLEW_PATH")
          echo "Main Android project root containing gradlew is: $MAIN_DIR"
          
          cd "$MAIN_DIR"
          
          # গ্র্যাডল র‍্যাপার স্ক্রিপ্টকে এক্সিকিউট করার পারমিশন দেওয়া
          chmod +x gradlew
          
          # লোকাল র‍্যাপার দিয়ে বিল্ড রান করা
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-APK
          path: "**/build/outputs/apk/debug/*.apk"

name: Build WaveTune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract wavetune.zip file
        run: |
          if [ -f "wavetune.zip" ]; then
            echo "wavetune.zip found! Extracting..."
            unzip -q wavetune.zip -d extracted_project
          else
            echo "Error: wavetune.zip not found in root directory!"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Directly
        run: |
          # app ফোল্ডারটি ঠিক কোথায় আছে তা খুঁজে বের করা
          APP_PATH=$(find ./extracted_project -type d -name "app" -print -quit)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: 'app' folder not found inside the zip!"
            exit 1
          fi
          
          MAIN_DIR=$(dirname "$APP_PATH")
          echo "Main Android project root is: $MAIN_DIR"
          
          cd "$MAIN_DIR"
          
          # যদি গ্র্যাডল ফাইল না থাকে, তবে রানার নিজে থেকেই একটি ফ্রেশ গ্র্যাডল র‍্যাপার জেনারেট করবে
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating a new gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          
          # গ্র্যাডল র‍্যাপার স্ক্রিপ্টকে এক্সিকিউট করার পারমিশন দেওয়া
          chmod +x gradlew
          
          # কনফিগারেশন ক্যাশ এবং পুরনো ক্যাশ পুরোপুরি ডিজেবল ও ক্লিন করে বিল্ড রান করা
          ./gradlew clean assembleDebug --no-configuration-cache --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveTune-APK
          path: "**/build/outputs/apk/debug/*.apk"
